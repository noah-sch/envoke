packages:
  - packages/*
allowBuilds:
  node-pty: false # prebuilt binaries ship in the package; its install script only checks for them
minimumReleaseAgeExclude:
  - "@vitest/mocker@5.1.2"
  - "@vitest/spy@5.1.2"
  - vitest@5.1.2
  - "@agentclientprotocol/sdk@2.12.0"
  - "@anthropic-ai/sdk@1.14.0"
  - openai@7.64.0
  - hono@4.13.22
  - "@types/react@19.3.3"
